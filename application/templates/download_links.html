<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download Tweets</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background: #f8f9fa;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }
      .download-container {
        background: white;
        padding: 2rem 3rem;
        border-radius: 12px;
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        text-align: center;
        max-width: 400px;
        width: 100%;
      }
      .btn-download {
        margin: 0.5rem;
        width: 150px;
        font-weight: 600;
        font-size: 1.1rem;
        transition: transform 0.2s ease;
      }
      .btn-download:hover {
        transform: scale(1.05);
      }
    </style>
</head>
<body>
    <div class="download-container border border-primary border-1 p-3 rounded">
        <div class="alert alert-success" role="alert">
            🎉 Successfully fetched and saved <strong>{{ count }}</strong> tweets!
        </div>
        <p class="mb-4">Download your files below:</p>
        <a href="{{ json_url }}" download class="btn btn-primary btn-download" id="jsonBtn">📥 Download JSON</a>
        <a href="{{ csv_url }}" download class="btn btn-success btn-download" id="csvBtn">📥 Download CSV</a>
    
        <div id="msg" class="mt-4 text-success fw-semibold" style="display:none;">Download started! Check your downloads folder.</div>
    </div>
    

    <script>
      // Show a small message when user clicks download buttons
      const msg = document.getElementById('msg');
      document.getElementById('jsonBtn').addEventListener('click', () => {
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      });
      document.getElementById('csvBtn').addEventListener('click', () => {
        msg.style.display = 'block';
        setTimeout(() => { msg.style.display = 'none'; }, 3000);
      });
    </script>
</body>
</html>
