<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Download Tweets by Category</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .download-container {
            background: white;
            padding: 2rem 3rem;
            border-radius: 12px;
            box-shadow: 0 0 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .btn-download {
            margin: 0.5rem;
            width: 180px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: transform 0.2s ease;
        }
        .btn-download:hover {
            transform: scale(1.05);
        }
        select.form-select {
            width: 100%;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="download-container border border-primary border-1 p-3 rounded">
        <h4 class="mb-3 text-primary fw-bold">Download Tweets by Category</h4>

        {% if category_keys %}
            <select id="category" class="form-select">
                <option value="">-- Select Category --</option>
                {% for category in category_keys %}
                    <option value="{{ category }}">{{ category|capfirst }}</option>
                {% endfor %}
            </select>

            <div id="downloadSection" style="display: none;">
                <p class="mb-2">
                    <strong>Number of Tweets:</strong> <span id="tweetCount" class="text-success"></span>
                </p>
                <a id="jsonLink" href="#" class="btn btn-primary btn-download" download>📥 JSON</a>
                <a id="csvLink" href="#" class="btn btn-success btn-download" download>📥 CSV</a>
                <a href="{% url 'sentiment_download_view' %}" class="btn btn-outline-secondary btn-download">
                    Proceed to Sentiments
                </a>
                <div id="msg" class="mt-3 text-success fw-semibold" style="display:none;">Download started!</div>
            </div>
        {% else %}
            <div class="alert alert-warning">No tweet files available yet.</div>
        {% endif %}

    

    </div>

    {{ file_links|json_script:"fileLinks-data" }}

    <script>
        const fileLinks = JSON.parse(document.getElementById('fileLinks-data').textContent);

        const categorySelect = document.getElementById("category");
        const jsonLink = document.getElementById("jsonLink");
        const csvLink = document.getElementById("csvLink");
        const tweetCount = document.getElementById("tweetCount");
        const section = document.getElementById("downloadSection");
        const msg = document.getElementById("msg");

        categorySelect.addEventListener("change", function () {
            const category = this.value;
            if (fileLinks[category]) {
                jsonLink.href = fileLinks[category]["json_url"];
                csvLink.href = fileLinks[category]["csv_url"];
                tweetCount.textContent = fileLinks[category]["count"];
            } else {
                jsonLink.href = "#";
                csvLink.href = "#";
                tweetCount.textContent = "0";
            }
            section.style.display = "block";
        });

        [jsonLink, csvLink].forEach(btn => {
            btn.addEventListener("click", () => {
                msg.style.display = 'block';
                setTimeout(() => { msg.style.display = 'none'; }, 3000);
            });
        });
    </script>
</body>
</html>
